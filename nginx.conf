resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # api.rtm.fr sends no CORS headers: the browser calls /api/rtm/* and nginx forwards it (same as the Vite dev proxy).
  location /api/rtm/ {
    set $rtm https://api.rtm.fr;
    rewrite ^/api/rtm/(.*)$ /front/$1 break;
    proxy_pass $rtm;
    proxy_ssl_server_name on;
    proxy_set_header Host api.rtm.fr;
    proxy_hide_header Access-Control-Allow-Origin;
    # The API is "no-cache" and the app already throttles itself (5 min per line); don't add a cache that could hide that.
    proxy_read_timeout 15s;
  }

  # Edited by hand / mounted by users: must never be stale.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # Scraped timetables change only when the scraper is re-run.
  location /schedules/ {
    add_header Cache-Control "public, max-age=3600";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
